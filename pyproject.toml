[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testing-and-eval-agent-maf"
version = "0.1.0"
description = "Scaffolding-only repository for a Microsoft Agent Framework testing and evaluation POC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "proMX AI Team" }
]
keywords = [
    "microsoft-agent-framework",
    "microsoft-foundry",
    "playwright",
    "testing",
    "evaluation",
    "mcp",
    "quality-assurance"
]

dependencies = [
    "agent-framework>=1.0.0,<2.0.0",
    "azure-identity>=1.19.0,<2.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "PyYAML>=6.0.2,<7.0.0",
    "rich>=13.9.0,<15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.9.0,<1.0.0",
    "mypy>=1.14.0,<2.0.0",
    "types-PyYAML>=6.0.12.20250915",
]

evaluation = [
    "azure-ai-evaluation>=1.0.0,<2.0.0",
]

[project.scripts]
testing-eval-agent = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "C4",
    "SIM",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "agent_framework.*",
    "azure.ai.evaluation.*",
]
ignore_missing_imports = true